metadata:
  title: "Arduino Uno to HD44780 LCD Display"
  description: "4-bit LCD interface with 10k contrast potentiometer and 12-ohm backlight resistor"

connectors:
  X1:
    type: Arduino UNO
    subtype: female
    pinlabels: [5V, GND, D2, D3, D4, D5, D6, D7]

  X2:
    type: LCD Densitron LWM1604A
    subtype: female
    pinlabels: [0V, 5V, V0_contrast, RS, R_W, E, DB0, DB1, DB2, DB3, DB4, DB5, DB6, DB7, Led+, Led-]

  X3:
    type: Potentiometer 10K
    subtype: female
    pinlabels: [GND, Wiper, 5V]

  X4:
    type: Resistor 12 Ohm
    subtype: axial
    pinlabels: [5V_IN, LED_OUT]

cables:
  W1:
    gauge: 0.25 mm2
    length: 0.2
    color_code: DIN
    wirecount: 6

  W2:
    gauge: 0.25 mm2
    length: 0.2
    color_code: DIN
    wirecount: 8

  W_POT_PWR:
    gauge: 0.25 mm2
    length: 0.15
    color_code: DIN
    wirecount: 2

  W_CONTRAST:
    gauge: 0.25 mm2
    length: 0.15
    color_code: DIN
    wirecount: 1
    colors: [YE]

  W_RES_IN:
    gauge: 0.25 mm2
    length: 0.10
    color_code: DIN
    wirecount: 1
    colors: [RD]

  W_RES_OUT:
    gauge: 0.25 mm2
    length: 0.10
    color_code: DIN
    wirecount: 1
    colors: [RD]

connections:
  # 4-bit bus: D2->RS, D3->E, D4..D7 -> DB4..DB7
  -
    - X1: [3, 4, 5, 6, 7, 8]
    - W1: [1, 2, 3, 4, 5, 6]
    - X2: [4, 6, 11, 12, 13, 14]

  # Power, Ground, and Grounded Inputs (R/W, DB0-DB3, Backlight Cathode)
  -
    - X1: [2, 1, 2, 2, 2, 2, 2, 2]
    - W2: [1, 2, 3, 4, 5, 6, 7, 8]
    - X2: [1, 2, 5, 7, 8, 9, 10, 16]

  # Potentiometer 5V & GND feed
  -
    - X1: [2, 1]
    - W_POT_PWR: [1, 2]
    - X3: [1, 3]

  # Contrast Wiper to LCD V0
  -
    - X3: 2
    - W_CONTRAST: 1
    - X2: 3

  # Arduino 5V to Resistor
  -
    - X1: 1
    - W_RES_IN: 1
    - X4: 1

  # Resistor to Backlight Anode
  -
    - X4: 2
    - W_RES_OUT: 1
    - X2: 15
