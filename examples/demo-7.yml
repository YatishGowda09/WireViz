# Device: theft-detector-node-01 (ESP32 DevKit)
# WiFi: YOUR_WIFI_SSID / YOUR_WIFI_PASSWORD
# MQTT Broker: mqtt.eclipseprojects.io:1883 (Client: theft_detector_01)
# Telemetry Topic: iot/power_monitor/data | Alerts Topic: iot/power_monitor/alerts
# Logic: Differential current threshold (0.5A, 5s delay) -> Buzzer, Alert, Cut Relay

metadata:
  title: "Theft Detector Node 01 - Wiring Diagram"
  description: "ESP32 power theft monitor with dual ACS712 current sensors, ZMPT101B voltage sensor, buzzer and relay"
  device: "theft-detector-node-01"
  platform: "esp32 (esp32dev)"
  logic: "differential_current (threshold: 0.5A, delay: 5s)"

connectors:
  ESP32:
    type: ESP32 DevKit V1
    subtype: female
    pins: [VIN, GND, D34, D35, D32, D12, D14]
    pinlabels: [5V, GND, "GPIO34 (Curr Main)", "GPIO35 (Curr Dist)", "GPIO32 (Volt Main)", "GPIO12 (Buzzer)", "GPIO14 (Relay)"]

  ACS712_MAIN:
    type: ACS712 Current Sensor
    subtype: male
    pins: [VCC, GND, OUT]
    pinlabels: [5V, GND, OUT]

  ACS712_DIST:
    type: ACS712 Current Sensor
    subtype: male
    pins: [VCC, GND, OUT]
    pinlabels: [5V, GND, OUT]

  ZMPT101B:
    type: ZMPT101B Voltage Sensor
    subtype: male
    pins: [VCC, GND, OUT]
    pinlabels: [5V, GND, OUT]

  BUZZER:
    type: Active Buzzer Module
    subtype: male
    pins: [GND, SIG]
    pinlabels: [GND, IN]

  RELAY:
    type: 1-Channel Relay Module
    subtype: male
    pins: [VCC, GND, IN]
    pinlabels: [5V, GND, IN]

cables:
  W_MAIN:
    gauge: 0.2 mm2
    length: 0.15
    color_code: DIN
    wirecount: 3
    colors: [RD, BK, YE]

  W_DIST:
    gauge: 0.2 mm2
    length: 0.15
    color_code: DIN
    wirecount: 3
    colors: [RD, BK, GN]

  W_VOLT:
    gauge: 0.2 mm2
    length: 0.15
    color_code: DIN
    wirecount: 3
    colors: [RD, BK, BU]

  W_BUZZER:
    gauge: 0.2 mm2
    length: 0.10
    color_code: DIN
    wirecount: 2
    colors: [BK, OG]

  W_RELAY:
    gauge: 0.2 mm2
    length: 0.15
    color_code: DIN
    wirecount: 3
    colors: [RD, BK, VT]

connections:
  # All connections strictly follow ESP32 vertical pin order:
  # Row 1 (VIN: 5V) -> Wire 1 (RD)
  # Row 2 (GND: GND) -> Wire 2 (BK)
  # Row 3..7 (GPIO pins) -> Wire 3
  -
    - ESP32: [VIN, GND, D34]
    - W_MAIN: [1, 2, 3]
    - ACS712_MAIN: [VCC, GND, OUT]
  -
    - ESP32: [VIN, GND, D35]
    - W_DIST: [1, 2, 3]
    - ACS712_DIST: [VCC, GND, OUT]
  -
    - ESP32: [VIN, GND, D32]
    - W_VOLT: [1, 2, 3]
    - ZMPT101B: [VCC, GND, OUT]
  -
    - ESP32: [VIN, GND, D14]
    - W_RELAY: [1, 2, 3]
    - RELAY: [VCC, GND, IN]
  -
    - ESP32: [GND, D12]
    - W_BUZZER: [1, 2]
    - BUZZER: [GND, SIG]

groups:
  controller_unit:
    label: "ESP32 Controller Node"
    style: solid
    color: "#2C3E50"
    bgcolor: "#F2F4F4"
    members: [ESP32]

  measurement_unit:
    label: "Power Monitoring Sensors"
    style: dashed
    color: "#2980B9"
    bgcolor: "#EBF5FB"
    members: [ACS712_MAIN, ACS712_DIST, ZMPT101B]

  actuator_unit:
    label: "Alarm & Contactor Protection"
    style: dashed
    color: "#C0392B"
    bgcolor: "#FDEDEC"
    members: [RELAY, BUZZER]
